# docker-compose.yml — Stack local ERP Django (W16)
# SOLO para equipos con Docker Desktop. Render NO usa este archivo.
# Servicios: db, redis, web, celery_worker, flower.
services:

  # ── Base de datos PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-erp_db}
      POSTGRES_USER:     ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_pass_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Broker de mensajes Redis — W16 ──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"          # solo accesible desde este equipo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Aplicación Django (usa docker-entrypoint.sh) ────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_pass_local}@db:5432/${POSTGRES_DB:-erp_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_EMBEDDED_WORKER: "0"      # el worker corre en su propio servicio

  # ── Worker de Celery — W16 ──────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A core worker -l info -Q erp_django
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_pass_local}@db:5432/${POSTGRES_DB:-erp_db}
      REDIS_URL: redis://redis:6379/0

  # ── Flower — Monitor de Celery — W16 (http://localhost:5555) ────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A core flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"          # solo accesible desde este equipo
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_pass_local}@db:5432/${POSTGRES_DB:-erp_db}
      REDIS_URL: redis://redis:6379/0
  # ── Celery Beat — Scheduler de tareas programadas — W18 ────────────
  celery_beat:
    build: .
    restart: unless-stopped
    # Beat NUNCA debe tener múltiples réplicas (un solo scheduler)
    command: celery -A core beat -l info   # scheduler por defecto (sin django_celery_beat)
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_prod
      SECRET_KEY:             dev-clave-docker-no-usar-en-produccion
      DATABASE_URL:           postgres://erp_user:erp_pass_local@db:5432/erp_db
      REDIS_URL:              redis://redis:6379/0
volumes:
  postgres_data: {}
  static_volume: {}
  media_volume: {}